<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCEDO.UZ - Bo'limlar</title>
    <style>
        body { background-color: #0F0F2F; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 24px; max-width: 400px; width: 100%; }
        h1 { color: #2196F3; font-size: 26px; margin-bottom: 8px; }
        h2 { font-size: 18px; margin-bottom: 40px; }
        .btn { width: 100%; padding: 14px; margin-bottom: 16px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; color: white; cursor: pointer; display: block; box-sizing: border-box; text-decoration: none; }
        .btn-all { background-color: #4CAF50; }
        .btn-subject { background-color: #2196F3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ALCEDO.UZ</h1>
        <h2>IMTIHON BO'LIMINI TANLANG</h2>

        <button class="btn btn-all" onclick="startQuiz('umumiy')">📊 UMUMIY IMTIHON</button>
        <button class="btn btn-subject" onclick="startQuiz('metrologiya')">📐 METROLOGIYADAN IMTIHON</button>
        <button class="btn btn-subject" onclick="startQuiz('standartlashtirish')">📜 STANDARTLASHTIRISHDAN IMTIHON</button>
        <button class="btn btn-subject" onclick="startQuiz('sertifikatlashtirish')">🎖 SERTIFIKATLASHTIRISHDAN IMTIHON</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user') || 'Foydalanuvchi';

        function startQuiz(categoryName) {
            // ➔ Test sahifasiga ism va bo'limni yuboramiz
            window.location.href = "quiz.html?user=" + encodeURIComponent(userName) + "&category=" + categoryName;
        }
    </script>
</body>
</html>
